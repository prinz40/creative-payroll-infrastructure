<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CreativePay - Digital Wallet</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
body { background: #f5f5f5; }
.container { max-width: 500px; margin: 0 auto; background: white; min-height: 100vh; }
.header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 20px; text-align: center; }
.btn { width: 100%; padding: 14px; background: #667eea; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; margin-top: 10px; }
.btn:disabled { opacity: 0.6; cursor: not-allowed; }
.input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; margin-top: 10px; }
.card { background: white; padding: 15px; margin: 10px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
.hidden { display: none; }
.balance { font-size: 32px; font-weight: bold; color: #667eea; }
</style>
</head>
<body>
<div class="container">
  <div class="header"><h1>CreativePay</h1></div>
  
  <div id="authSection" class="card">
    <h2 id="authTitle">Login</h2>
    <input type="email" id="email" class="input" placeholder="Email">
    <input type="password" id="password" class="input" placeholder="Password">
    <input type="text" id="fullName" class="input hidden" placeholder="Full Name">
    <button class="btn" id="authBtn" onclick="handleAuth()">Login</button>
    <p style="text-align:center; margin-top:10px;">
      <a href="#" onclick="switchToRegister()">Don't have an account? Register</a>
    </p>
  </div>

  <div id="bvnSection" class="card hidden">
    <h2>Verify BVN</h2>
    <input type="text" id="bvn" class="input" placeholder="11 Digit BVN" maxlength="11">
    <button class="btn" onclick="submitBVN()">Verify BVN</button>
  </div>

  <div id="dashboard" class="hidden">
    <div class="card">
      <p>Wallet Balance</p>
      <div class="balance" id="balance">₦0.00</div>
    </div>
    <div class="card">
      <h3>Fund Wallet</h3>
      <input type="number" id="fundAmount" class="input" placeholder="Amount">
      <button class="btn" onclick="fundWallet()">Fund with Paystack</button>
    </div>
    <div class="card">
      <h3>Send Money</h3>
      <input type="email" id="transferEmail" class="input" placeholder="Recipient Email">
      <input type="number" id="transferAmount" class="input" placeholder="Amount">
      <button class="btn" onclick="transferMoney()">Send</button>
    </div>
    <div class="card">
      <h3>Buy Airtime</h3>
      <input type="text" id="airtimeNumber" class="input" placeholder="Phone Number">
      <input type="number" id="airtimeAmount" class="input" placeholder="Amount">
      <input type="text" id="airtimeNetwork" class="input" placeholder="Network">
      <button class="btn" onclick="buyAirtime()">Buy Airtime</button>
    </div>
    <button class="btn" style="background:#ff4757" onclick="handleLogout()">Logout</button>
  </div>
</div>

<script>
const API_URL = '/api';
let currentUser = null;

function getToken() { return localStorage.getItem('token'); }
function setToken(token) { localStorage.setItem('token', token); }
function clearToken() { localStorage.removeItem('token'); }

async function apiCall(endpoint, method = 'GET', data = null) {
  const headers = { 'Content-Type': 'application/json' };
  const token = getToken();
  if (token) headers['Authorization'] = `Bearer ${token}`;
  
  const res = await fetch(API_URL + endpoint, {
    method, headers, body: data ? JSON.stringify(data) : null
  });
  return res.json();
}

async function handleAuth() {
  const btn = document.getElementById('authBtn');
  btn.disabled = true; btn.textContent = 'Please wait...';
  try {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const isRegister = document.getElementById('fullName').classList.contains('hidden') === false;
    const endpoint = isRegister ? '/register' : '/login';
    const data = isRegister ? { email, password, fullName: document.getElementById('fullName').value } : { email, password };
    
    const result = await apiCall(endpoint, 'POST', data);
    if (result.success) {
      setToken(result.token);
      currentUser = result.user;
      if (result.user.kycTier === 0) showBVN();
      else showDashboard(result.user);
    } else alert(result.message);
  } catch(e) { alert('Error: ' + e.message); }
  finally { btn.disabled = false; btn.textContent = 'Login'; }
}

async function submitBVN() {
  const bvn = document.getElementById('bvn').value;
  const result = await apiCall('/bvn', 'POST', { bvn });
  if (result.success) showDashboard(result.user);
  else alert(result.message);
}

async function fundWallet() {
  const amount = document.getElementById('fundAmount').value;
  const result = await apiCall('/wallet/fund', 'POST', { amount });
  if (result.success) window.location.href = result.authorization_url;
  else alert(result.message);
}

async function transferMoney() {
  const email = document.getElementById('transferEmail').value;
  const amount = document.getElementById('transferAmount').value;
  const result = await apiCall('/wallet/transfer', 'POST', { email, amount });
  alert(result.message);
  if (result.success) refreshUser();
}

async function buyAirtime() {
  const number = document.getElementById('airtimeNumber').value;
  const amount = document.getElementById('airtimeAmount').value;
  const network = document.getElementById('airtimeNetwork').value;
  const result = await apiCall('/wallet/airtime', 'POST', { number, amount, network });
  alert(result.message);
  if (result.success) refreshUser();
}

async function refreshUser() {
  const data = await apiCall('/user');
  if (data.success) showDashboard(data.user);
}

function switchToRegister() {
  document.getElementById('authTitle').textContent = 'Register';
  document.getElementById('authBtn').textContent = 'Register';
  document.getElementById('fullName').classList.remove('hidden');
  document.querySelector('#authSection a').onclick = switchToLogin;
  document.querySelector('#authSection a').textContent = 'Already have an account? Login';
}

function switchToLogin() {
  document.getElementById('authTitle').textContent = 'Login';
  document.getElementById('authBtn').textContent = 'Login';
  document.getElementById('fullName').classList.add('hidden');
  document.querySelector('#authSection a').onclick = switchToRegister;
  document.querySelector('#authSection a').textContent = 'Don\'t have an account? Register';
}

function showBVN() {
  document.getElementById('authSection').classList.add('hidden');
  document.getElementById('bvnSection').classList.remove('hidden');
}

function showDashboard(user) {
  currentUser = user;
  document.getElementById('authSection').classList.add('hidden');
  document.getElementById('bvnSection').classList.add('hidden');
  document.getElementById('dashboard').classList.remove('hidden');
  document.getElementById('balance').textContent = `₦${(user.balances.NGN || 0).toLocaleString()}`;
}

function handleLogout() {
  clearToken();
  location.reload();
}

window.addEventListener('DOMContentLoaded', async () => {
  const token = getToken();
  if (token) {
    try {
      const data = await apiCall('/user');
      if (data.success) showDashboard(data.user);
      else { clearToken(); switchToLogin(); }
    } catch { clearToken(); switchToLogin(); }
  }
});
</script>
</body>
</html>

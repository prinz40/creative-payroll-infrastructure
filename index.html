<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CreativePay - Global Digital Wallet</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
body { background: #f5f5f5; }
.container { max-width: 500px; margin: 0 auto; background: white; min-height: 100vh; }
.header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 20px; text-align: center; }
.btn { width: 100%; padding: 14px; background: #667eea; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; margin-top: 10px; }
.btn:disabled { opacity: 0.6; cursor: not-allowed; }
.input, .select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; margin-top: 10px; }
.card { background: white; padding: 15px; margin: 10px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
.hidden { display: none; }
.balance { font-size: 22px; font-weight: bold; color: #667eea; }
.currency-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.currency-card { background: #f0f4ff; padding: 10px; border-radius: 8px; text-align: center; }
.txn { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eee; }
.success { color: #2ed573; } .pending { color: #ffa502; } .failed { color: #ff4757; }
.kyc-badge { background: #2ed573; color: white; padding: 4px 8px; border-radius: 20px; font-size: 12px; }
.kyc-pending { background: #ffa502; color: white; padding: 4px 8px; border-radius: 20px; font-size: 12px; }
.wallet-id { background: #eee; padding: 8px; border-radius: 6px; font-family: monospace; font-size: 12px; }
</style>
</head>
<body>
<div class="container">
  <div class="header"><h1>CreativePay</h1><p style="font-size:12px">Beat Payoneer + Wise 💪</p></div>

  <!-- AUTH SECTION -->
  <div id="authSection" class="card">
    <h2 id="authTitle">Login</h2>
    <input type="text" id="fullNameInput" class="input hidden" placeholder="Full Name">
    <input type="email" id="emailInput" class="input" placeholder="Email">
    <input type="password" id="passwordInput" class="input" placeholder="Password">
    <p id="errorMsg" style="color:red; font-size:12px; margin-top:5px"></p>
    <button class="btn" id="authBtn" onclick="handleAuth()">Login</button>
    <p style="text-align:center; margin-top:10px;">
      <a href="#" id="toggleAuthLink" onclick="switchToRegister()">Don't have an account? Register</a>
    </p>
  </div>

  <!-- BVN VERIFICATION SECTION -->
  <div id="bvnSection" class="card hidden">
    <h2>Verify BVN</h2>
    <input type="text" id="bvnInput" class="input" placeholder="11 Digit BVN" maxlength="11">
    <p id="bvnError" style="color:red; font-size:12px; margin-top:5px; display:none"></p>
    <p id="bvnSuccess" style="color:green; font-size:12px; margin-top:5px; display:none"></p>
    <button class="btn" id="verifyBvnBtn" onclick="verifyBVN()">Verify BVN</button>
  </div>

  <!-- MAIN DASHBOARD -->
  <div id="dashboard" class="hidden">
    <div class="card">
      <h3>Welcome, <span id="userDispName">User</span></h3>
      <p style="color:gray; font-size:14px" id="userDispEmail"></p>
      <p style="margin-top:8px"><b>Wallet ID:</b> <span id="walletId" class="wallet-id"></span></p>
      <p style="margin-top:8px"><b>KYC Status:</b> <span id="kycStatus" class="kyc-badge">Verified</span></p>
    </div>

    <div class="card">
      <h3>Multi-Currency Wallet</h3>
      <div class="currency-grid">
        <div class="currency-card"><small>NGN</small><div id="balanceNGN" class="balance">0.00</div></div>
        <div class="currency-card"><small>GHS</small><div id="balanceGHS" class="balance">0.00</div></div>
        <div class="currency-card"><small>KES</small><div id="balanceKES" class="balance">0.00</div></div>
        <div class="currency-card"><small>USD</small><div id="balanceUSD" class="balance">0.00</div></div>
        <div class="currency-card"><small>EUR</small><div id="balanceEUR" class="balance">0.00</div></div>
        <div class="currency-card"><small>GBP</small><div id="balanceGBP" class="balance">0.00</div></div>
      </div>
    </div>

    <div class="card">
      <h3>Fund Wallet</h3>
      <input type="number" id="fundAmount" class="input" placeholder="Amount Min 100">
      <select id="fundCurrency" class="select">
        <option value="NGN">NGN - Nigerian Naira</option>
        <option value="GHS">GHS - Ghana Cedi</option>
        <option value="KES">KES - Kenyan Shilling</option>
        <option value="USD">USD - US Dollar</option>
        <option value="EUR">EUR - Euro</option>
        <option value="GBP">GBP - British Pound</option>
      </select>
      <p id="fundError" style="color:red; font-size:12px; margin-top:5px"></p>
      <button class="btn" onclick="fundWallet()">Fund Wallet</button>
    </div>

    <div class="card">
      <h3>Send Money</h3>
      <input type="text" id="recipient" class="input" placeholder="Recipient Email OR Wallet ID">
      <input type="number" id="sendAmount" class="input" placeholder="Amount">
      <select id="sendCurrency" class="select">
        <option value="NGN">NGN</option>
        <option value="GHS">GHS</option>
        <option value="KES">KES</option>
        <option value="USD">USD</option>
        <option value="EUR">EUR</option>
        <option value="GBP">GBP</option>
      </select>
      <input type="text" id="narration" class="input" placeholder="Narration - Optional">
      <p id="sendError" style="color:red; font-size:12px; margin-top:5px"></p>
      <button class="btn" onclick="sendMoney()">Send</button>
    </div>

    <div class="card">
      <h3>Buy Airtime</h3>
      <input type="text" id="airtimeNumber" class="input" placeholder="Phone Number">
      <input type="number" id="airtimeAmount" class="input" placeholder="Amount">
      <select id="airtimeNetwork" class="select">
        <option value="MTN">MTN</option>
        <option value="AIRTEL">AIRTEL</option>
        <option value="GLO">GLO</option>
        <option value="9MOBILE">9MOBILE</option>
      </select>
      <p id="airtimeError" style="color:red; font-size:12px; margin-top:5px"></p>
      <button class="btn" onclick="buyAirtime()">Buy Airtime</button>
    </div>

    <div class="card">
      <h3>Transaction History</h3>
      <div id="transactionList">No recent transactions.</div>
    </div>

    <button class="btn" style="background:#ff4757" onclick="handleLogout()">Logout</button>
  </div>
</div>

<script>
// REPLACE WITH YOUR ACTUAL LIVE RENDER ENDPOINT SYSTEM URL
const API_BASE_URL = "https://onrender.com";

let isLoginMode = true;
let authToken = localStorage.getItem("token") || null;

document.addEventListener("DOMContentLoaded", () => {
    if (authToken) {
        fetchDashboardData();
    }
});

function switchToRegister() {
    isLoginMode = false;
    document.getElementById("authTitle").innerText = "Register";
    document.getElementById("fullNameInput").classList.remove("hidden");
    document.getElementById("authBtn").innerText = "Register";
    document.getElementById("toggleAuthLink").outerHTML = '<a href="#" id="toggleAuthLink" onclick="switchToLogin()">Already have an account? Login</a>';
}

function switchToLogin() {
    isLoginMode = true;
    document.getElementById("authTitle").innerText = "Login";
    document.getElementById("fullNameInput").classList.add("hidden");
    document.getElementById("authBtn").innerText = "Login";
    document.getElementById("toggleAuthLink").outerHTML = '<a href="#" id="toggleAuthLink" onclick="switchToRegister()">Don\'t have an account? Register</a>';
}

async function handleAuth() {
    const email = document.getElementById("emailInput").value.trim();
    const password = document.getElementById("passwordInput").value;
    const fullName = document.getElementById("fullNameInput").value.trim();
    const errorMsg = document.getElementById("errorMsg");
    
    errorMsg.innerText = "";
    if(!email || !password || (!isLoginMode && !fullName)) {
        errorMsg.innerText = "Please fill all required inputs.";
        return;
    }

    const endpoint = isLoginMode ? "/auth/login" : "/auth/register";
    const payload = isLoginMode ? { email, password } : { name: fullName, email, password };

    try {
        const response = await fetch(`${API_BASE_URL}${endpoint}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        });
        const data = await response.json();

        if (!response.ok) throw new Error(data.message || "Authentication failed.");

        authToken = data.token;
        localStorage.setItem("token", authToken);
        
        if (!isLoginMode || data.user.kycStatus === "Unverified") {
            showBvnVerification();
        } else {
            fetchDashboardData();
        }
    } catch (err) {
        errorMsg.innerText = err.message;
    }
}

function showBvnVerification() {
    document.getElementById("authSection").classList.add("hidden");
    document.getElementById("bvnSection").classList.remove("hidden");
    document.getElementById("dashboard").classList.add("hidden");
}

async function verifyBVN() {
    const bvn = document.getElementById("bvnInput").value.trim();
    const bvnError = document.getElementById("bvnError");
    const bvnSuccess = document.getElementById("bvnSuccess");

    bvnError.style.display = "none";
    bvnSuccess.style.display = "none";

    if (bvn.length !== 11 || isNaN(bvn)) {
        bvnError.innerText = "BVN must be exactly 11 numeric digits.";
        bvnError.style.display = "block";
        return;
    }

    try {
        const response = await fetch(`${API_BASE_URL}/kyc/verify-bvn`, {
            method: "POST",
            headers: { 
                "Content-Type": "application/json",        },
        body: JSON.stringify({ bvn })
    });
    
    const data = await response.json();
    // Add your success handling logic here (e.g., bvnSuccess.style.display = "block")

} catch (error) {
    console.error(error);
}

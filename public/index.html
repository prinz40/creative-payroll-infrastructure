<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CreativePay Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f172a; color: #e2e8f0; padding: 20px;
    }
    .container { max-width: 400px; margin: 40px auto; }
    h1 { text-align: center; margin-bottom: 30px; color: #38bdf8; }
    .card { 
      background: #1e293b; padding: 30px; border-radius: 12px; 
      box-shadow: 0 4px 6px rgba(0,0,0,0.3); margin-bottom: 20px;
    }
    .form-group { margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; font-size: 14px; color: #94a3b8; }
    input, select { 
      width: 100%; padding: 12px; background: #0f172a; 
      border: 1px solid #334155; border-radius: 8px; color: #e2e8f0;
    }
    input:focus, select:focus { outline: none; border-color: #38bdf8; }
    button { 
      width: 100%; padding: 12px; background: #38bdf8; color: #0f172a;
      border: none; border-radius: 8px; font-weight: 600; cursor: pointer;
    }
    button:hover { background: #0ea5e9; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .error { color: #f87171; font-size: 14px; margin-top: 10px; text-align: center; }
    .success { color: #4ade80; font-size: 14px; margin-top: 10px; text-align: center; }
    .toggle { text-align: center; margin-top: 16px; font-size: 14px; }
    .toggle a { color: #38bdf8; cursor: pointer; text-decoration: none; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <h1>CreativePay</h1>
    
    <!-- REGISTER FORM -->
    <div id="registerCard" class="card">
      <h2 style="margin-bottom: 20px; text-align: center;">Create Account</h2>
      <form id="registerForm">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="regName" required>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="regEmail" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="regPassword" required minlength="6">
        </div>
        <div class="form-group">
          <label>Phone</label>
          <input type="tel" id="regPhone">
        </div>
        <div class="form-group">
          <label>Provider</label>
          <select id="regProvider">
            <option value="">Select Provider</option>
            <option value="MTN">MTN</option>
            <option value="Airtel">Airtel</option>
            <option value="Glo">Glo</option>
            <option value="9mobile">9mobile</option>
          </select>
        </div>
        <div class="form-group">
          <label>Country</label>
          <input type="text" id="regCountry" value="Nigeria">
        </div>
        <button type="submit" id="regButton">Create Account</button>
        <div id="regMessage"></div>
      </form>
      <div class="toggle">
        Already have an account? <a onclick="showLogin()">Login</a>
      </div>
    </div>

    <!-- LOGIN FORM -->
    <div id="loginCard" class="card hidden">
      <h2 style="margin-bottom: 20px; text-align: center;">Login</h2>
      <form id="loginForm">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="loginEmail" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="loginPassword" required>
        </div>
        <button type="submit" id="loginButton">Login</button>
        <div id="loginMessage"></div>
      </form>
      <div class="toggle">
        No account? <a onclick="showRegister()">Create Account</a>
      </div>
    </div>
  </div>

  <script>
    // Toggle forms
    function showLogin() {
      document.getElementById('registerCard').classList.add('hidden');
      document.getElementById('loginCard').classList.remove('hidden');
    }
    function showRegister() {
      document.getElementById('loginCard').classList.add('hidden');
      document.getElementById('registerCard').classList.remove('hidden');
    }

    // REGISTER HANDLER - THIS IS THE FIX
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const button = document.getElementById('regButton');
      const message = document.getElementById('regMessage');
      
      button.disabled = true;
      button.textContent = 'Creating...';
      message.innerHTML = '';

      const data = {
        name: document.getElementById('regName').value,
        email: document.getElementById('regEmail').value,
        password: document.getElementById('regPassword').value,
        phone: document.getElementById('regPhone').value,
        provider: document.getElementById('regProvider').value,
        country: document.getElementById('regCountry').value
      };

      try {
        const response = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });

        const result = await response.json();

        if (!response.ok) {
          throw new Error(result.error || 'Registration failed');
        }

        message.innerHTML = '<div class="success">Account created! You can now login.</div>';
        document.getElementById('registerForm').reset();
        setTimeout(showLogin, 1500);
        
      } catch (error) {
        message.innerHTML = `<div class="error">${error.message}</div>`;
      } finally {
        button.disabled = false;
        button.textContent = 'Create Account';
      }
    });

    // LOGIN HANDLER
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const button = document.getElementById('loginButton');
      const message = document.getElementById('loginMessage');
      
      button.disabled = true;
      button.textContent = 'Logging in...';
      message.innerHTML = '';

      const data = {
        email: document.getElementById('loginEmail').value,
        password: document.getElementById('loginPassword').value
      };

      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });

        const result = await response.json();

        if (!response.ok) {
          throw new Error(result.error || 'Login failed');
        }

        localStorage.setItem('token', result.token);
        message.innerHTML = '<div class="success">Login successful! Redirecting...</div>';
        
        // Redirect to dashboard here
        // window.location.href = '/dashboard.html';
        
      } catch (error) {
        message.innerHTML = `<div class="error">${error.message}</div>`;
      } finally {
        button.disabled = false;
        button.textContent = 'Login';
      }
    });
  </script>
</body>
</html>

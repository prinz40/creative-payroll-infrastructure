<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CreativePay - Phase 4D v1.3.7</title>
<style>
:root{--primary:#1A1A2E;--accent:#0F9D58;--bg:#F5F5F7;--card:#fff;--text:#1A1A2E;--muted:#6B7280}
*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,system-ui,sans-serif}
body{background:var(--bg);color:var(--text);padding:20px}
.container{max-width:420px;margin:0 auto}
.card{background:var(--card);border-radius:16px;padding:24px;margin-bottom:16px;box-shadow:0 4px 12px rgba(0,0,0,.06)}
.btn{width:100%;padding:14px;border:none;border-radius:12px;background:var(--accent);color:#fff;font-weight:600;font-size:16px;cursor:pointer;margin-top:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.input{width:100%;padding:14px;border:1px solid #E5E7EB;border-radius:12px;margin-top:8px;font-size:16px}
.hidden{display:none}
.tab{display:flex;gap:8px;margin-bottom:16px}
.tab button{flex:1;padding:12px;border:none;border-radius:12px;background:#E5E7EB;font-weight:600}
.tab button.active{background:var(--accent);color:#fff}
.balance{font-size:32px;font-weight:800;color:var(--accent)}
.row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #F3F4F6}
.kyc-badge{padding:6px 12px;border-radius:20px;font-size:12px;font-weight:700}
.kyc-UNVERIFIED{background:#FEE2E2;color:#991B1B}
.kyc-TIER_1_VERIFIED{background:#D1FAE5;color:#065F46}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--primary);color:#fff;padding:12px 20px;border-radius:12px;z-index:999;display:none}
</style>
</head>
<body>
<div id="toast" class="toast"></div>
<div class="container">

  <!-- AUTH SCREEN -->
  <div id="auth-screen" class="card">
    <h2>CreativePay</h2>
    <p style="color:var(--muted);margin:8px 0 16px">Multi-Currency P2P Wallet</p>
    <div class="tab">
      <button id="login-tab" class="active">Login</button>
      <button id="reg-tab">Register</button>
    </div>
    <div id="login-form">
      <input id="login-email" class="input" placeholder="Email">
      <input id="login-pass" type="password" class="input" placeholder="Password">
      <button id="login-btn" class="btn">Login</button>
    </div>
    <div id="reg-form" class="hidden">
      <input id="reg-name" class="input" placeholder="Full Name">
      <input id="reg-email" class="input" placeholder="Email">
      <input id="reg-pass" type="password" class="input" placeholder="Password">
      <button id="reg-btn" class="btn">Create Account</button>
    </div>
  </div>

  <!-- APP SCREEN -->
  <div id="app-screen" class="hidden">
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div>
          <div id="user-name" style="font-weight:700"></div>
          <div id="wallet-id" style="font-size:12px;color:var(--muted)"></div>
        </div>
        <span id="kyc-badge" class="kyc-badge">UNVERIFIED</span>
      </div>
      <div class="balance" id="balance-ngn">₦0.00</div>
      <button id="fund-btn" class="btn">Fund Wallet</button>
    </div>

    <div class="card">
      <h3>Send Money</h3>
      <input id="send-wallet" class="input" placeholder="Recipient Wallet ID e.g. CPY-ABC123">
      <input id="send-amount" type="number" class="input" placeholder="Amount NGN">
      <button id="send-btn" class="btn">Send</button>
    </div>

    <div class="card">
      <h3>Verify BVN [Tier 1]</h3>
      <input id="bvn" class="input" placeholder="11-digit BVN">
      <button id="verify-btn" class="btn">Verify</button>
    </div>

    <div class="card">
      <h3>Transactions</h3>
      <div id="tx-list"><div style="color:var(--muted)">No transactions yet</div></div>
    </div>
    <button id="logout-btn" class="btn" style="background:#EF4444">Logout</button>
  </div>
</div>

<script>
// === CONFIG v4 = CACHE BUST ===
const API_URL = window.location.origin; 
let TOKEN = localStorage.getItem('cp_token');

// === HELPER: FETCH WITH TIMEOUT + RETRY FOR RENDER COLD START ===
async function fetchWithRetry(url, options = {}, retries = 2, delay = 2000) {
  for (let i = 0; i <= retries; i++) {
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 15000); // 15s timeout
    try {
      const res = await fetch(url, { ...options, signal: controller.signal });
      clearTimeout(timeoutId);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Request failed');
      return data;
    } catch (error) {
      clearTimeout(timeoutId);
      const isLastAttempt = i === retries;
      const isNetworkError = error.name === 'AbortError' || error.message.includes('Failed to fetch');
      
      if (isNetworkError && !isLastAttempt) {
        toast(`Server waking up. Please tap Verify again in 5s.`);
        await new Promise(resolve => setTimeout(resolve, delay));
        continue;
      }
      throw error;
    }
  }
}

// === HELPERS ===
const $ = id => document.getElementById(id);
const toast = msg => {
  const t = $('toast'); t.textContent = msg; t.style.display='block';
  setTimeout(()=>t.style.display='none',3000);
}
const fmt = n => `₦${Number(n||0).toLocaleString('en-NG',{minimumFractionDigits:2})}`;

// === API WRAPPER ===
async function api(path, method='GET', body){
  return fetchWithRetry(API_URL+path,{
    method,
    headers:{'Content-Type':'application/json',...(TOKEN?{'Authorization':'Bearer '+TOKEN}:{})},
    body: body?JSON.stringify(body):null
  });
}

// === UI TOGGLE ===
function showApp(user){
  $('auth-screen').classList.add('hidden');
  $('app-screen').classList.remove('hidden');
  $('user-name').textContent = user.fullName;
  $('wallet-id').textContent = user.walletId;
  $('balance-ngn').textContent = fmt(user.balances.NGN);
  const badge = $('kyc-badge');
  badge.textContent = user.kycStatus.replace('_',' ');
  badge.className = `kyc-badge kyc-${user.kycStatus}`;
  renderTx(user.transactions);
}
function renderTx(txs){
  const el = $('tx-list');
  if(!txs||!txs.length) return el.innerHTML='<div style="color:var(--muted)">No transactions yet</div>';
  el.innerHTML = txs.slice(-5).reverse().map(tx=>`
    <div class="row">
      <div>${tx.desc}</div>
      <div style="color:${tx.type==='credit'?'var(--accent)':'#EF4444'}">
        ${tx.type==='credit'?'+':'-'}${fmt(tx.amount)}
      </div>
    </div>
  `).join('');
}

// === AUTH LOGIC ===
$('login-tab').onclick=()=>{
  $('login-tab').classList.add('active');$('reg-tab').classList.remove('active');
  $('login-form').classList.remove('hidden');$('reg-form').classList.add('hidden');
}
$('reg-tab').onclick=()=>{
  $('reg-tab').classList.add('active');$('login-tab').classList.remove('active');
  $('reg-form').classList.remove('hidden');$('login-form').classList.add('hidden');
}

$('reg-btn').onclick=async()=>{
  try{
    await api('/api/register','POST',{
      fullName:$('reg-name').value,
      email:$('reg-email').value,
      password:$('reg-pass').value
    });
    toast('Account created. Login now');
    $('login-tab').click();
  }catch(e){toast(e.message)}
}

$('login-btn').onclick=async()=>{
  try{
    const {token} = await api('/api/login','POST',{
      email:$('login-email').value,
      password:$('login-pass').value
    });
    TOKEN=token; localStorage.setItem('cp_token',token);
    const user = await api('/api/me');
    showApp(user);
  }catch(e){toast(e.message)}
}

$('logout-btn').onclick=()=>{
  TOKEN=null; localStorage.removeItem('cp_token');
  $('app-screen').classList.add('hidden');
  $('auth-screen').classList.remove('hidden');
}

// === APP LOGIC ===
$('verify-btn').onclick=async()=>{
  try{
    await api('/api/kyc/verify-bvn','POST',{bvn:$('bvn').value});
    const user = await api('/api/me'); showApp(user);
    toast('BVN Verified. Tier 1 Active');
  }catch(e){toast(e.message)}
}

$('fund-btn').onclick=async()=>{
  try{
    const {authorization_url} = await api('/api/wallet/fund','POST',{currency:'NGN'});
    toast('Redirecting to Paystack...');
    window.location.href = authorization_url; 
  }catch(e){toast(e.message)}
}

$('send-btn').onclick=async()=>{
  try{
    await api('/api/send','POST',{
      recipientWalletId:$('send-wallet').value,
      amount:Number($('send-amount').value),
      currency:'NGN'
    });
    const user = await api('/api/me'); showApp(user);
    toast('Transfer successful');
  }catch(e){toast(e.message)}
}

// === BOOT ===
(async()=>{
  if(TOKEN){
    try{
      const user = await api('/api/me');
      showApp(user);
    }catch{
      localStorage.removeItem('cp_token');
    }
  }
})();
</script>
</body>
</html>

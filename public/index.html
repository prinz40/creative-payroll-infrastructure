<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CreativePay - Login</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f172a; color: #e2e8f0; min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .container { width: 100%; max-width: 420px; }
    .logo { text-align: center; margin-bottom: 30px; }
    .logo h1 { color: #38bdf8; font-size: 32px; font-weight: 700; }
    .card {
      background: #1e293b; padding: 32px; border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid #334155;
    }
    .form-group { margin-bottom: 18px; }
    label { display: block; margin-bottom: 6px; font-size: 14px; color: #cbd5e1; }
    input, select {
      width: 100%; padding: 12px; background: #0f172a; border: 1px solid #334155;
      border-radius: 8px; color: #e2e8f0; font-size: 15px;
    }
    input:focus, select:focus { outline: none; border-color: #38bdf8; }
    button {
      width: 100%; padding: 14px; background: #0ea5e9; border: none;
      border-radius: 8px; color: white; font-size: 16px; font-weight: 600;
      cursor: pointer; margin-top: 8px;
    }
    button:disabled { background: #475569; cursor: not-allowed; }
    .toggle { text-align: center; margin-top: 20px; font-size: 14px; color: #94a3b8; }
    .toggle a { color: #38bdf8; cursor: pointer; text-decoration: none; }
    .message {
      padding: 12px; border-radius: 8px; margin-top: 16px; font-size: 14px;
      text-align: center; display: none;
    }
    .error { background: #7f1d1d; color: #fecaca; border: 1px solid #dc2626; }
    .success { background: #14532d; color: #bbf7d0; border: 1px solid #16a34a; }
    .kyc-warning {
      background: #713f12; color: #fef08a; border: 1px solid #eab308;
      padding: 12px; border-radius: 8px; margin-bottom: 20px; font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo"><h1>CreativePay</h1></div>

    <!-- LOGIN FORM -->
    <div id="loginCard" class="card">
      <h2 style="margin-bottom: 20px; text-align: center;">Welcome Back</h2>
      <form id="loginForm">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="loginEmail" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="loginPassword" required>
        </div>
        <button type="submit" id="loginButton">Login</button>
        <div id="loginMessage" class="message"></div>
      </form>
      <div class="toggle">
        Don't have an account? <a onclick="showRegister()">Create Account</a>
      </div>
    </div>

    <!-- REGISTER FORM -->
    <div id="registerCard" class="card" style="display: none;">
      <h2 style="margin-bottom: 20px; text-align: center;">Create Account</h2>
      <form id="registerForm">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="name" required>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" required minlength="6">
        </div>
        <div class="form-group">
          <label>Phone</label>
          <input type="tel" id="phone">
        </div>
        <div class="form-group">
          <label>Provider</label>
          <select id="provider">
            <option value="">Select Provider</option>
            <option value="MTN">MTN</option>
            <option value="Airtel">Airtel</option>
            <option value="Glo">Glo</option>
            <option value="9mobile">9mobile</option>
          </select>
        </div>
        <div class="form-group">
          <label>Country</label>
          <input type="text" id="country" value="Nigeria">
        </div>
        <button type="submit" id="regButton">Create Account</button>
        <div id="regMessage" class="message"></div>
      </form>
      <div class="toggle">
        Already have an account? <a onclick="showLogin()">Login</a>
      </div>
    </div>

    <!-- BVN VERIFICATION FORM - HIDDEN BY DEFAULT -->
    <div id="bvnCard" class="card" style="display: none;">
      <div class="kyc-warning">
        <strong>KYC TIER 1 REQUIRED</strong><br>
        Verify your BVN to unlock your CreativePay dashboard and enable transactions.
      </div>
      <h2 style="margin-bottom: 20px; text-align: center;">BVN Verification</h2>
      <form id="bvnForm">
        <div class="form-group">
          <label>Bank Verification Number (BVN)</label>
          <input type="text" id="bvn" required maxlength="11" pattern="[0-9]{11}" placeholder="Enter 11-digit BVN">
        </div>
        <button type="submit" id="bvnButton">Verify BVN</button>
        <div id="bvnMessage" class="message"></div>
      </form>
      <div class="toggle">
        <a onclick="logout()">Logout</a>
      </div>
    </div>
  </div>

  <!-- CRITICAL: Load app.js - This handles ALL logic -->
  <script src="/app.js"></script>
  
  <script>
    function showRegister() {
      document.getElementById('loginCard').style.display = 'none';
      document.getElementById('registerCard').style.display = 'block';
      document.getElementById('bvnCard').style.display = 'none';
    }
    
    function showLogin() {
      document.getElementById('registerCard').style.display = 'none';
      document.getElementById('loginCard').style.display = 'block';
      document.getElementById('bvnCard').style.display = 'none';
    }

    function showBVN() {
      document.getElementById('loginCard').style.display = 'none';
      document.getElementById('registerCard').style.display = 'none';
      document.getElementById('bvnCard').style.display = 'block';
    }

    function logout() {
      localStorage.removeItem('creativepay_token');
      window.location.href = '/';
    }

    // Check URL for kyc=required on page load
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('kyc') === 'required') {
        showBVN();
      }
    });
  </script>
</body>
</html>

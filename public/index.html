<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CreativePay</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      background: #0d1117; 
      color: #c9d1d9; 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      background: #161b22;
      padding: 30px;
      border-radius: 12px;
      width: 100%;
      max-width: 400px;
      border: 1px solid #30363d;
    }
    h1 { color: #58a6ff; text-align: center; margin-bottom: 20px; }
    h2 { text-align: center; margin-bottom: 20px; }
    .kyc-warning {
      background: #9e6a03;
      color: #fff;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 20px;
      font-size: 14px;
    }
    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #c9d1d9;
      font-size: 16px;
    }
    input:focus { outline: none; border-color: #58a6ff; }
    button {
      width: 100%;
      padding: 12px;
      background: #238636;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 12px;
    }
    button:hover { background: #2ea043; }
    button:disabled { background: #484f58; cursor: not-allowed; }
    .link {
      text-align: center;
      margin-top: 15px;
      color: #58a6ff;
      cursor: pointer;
      font-size: 14px;
    }
    .error {
      background: #da3633;
      color: white;
      padding: 10px;
      border-radius: 6px;
      margin: 10px 0;
      text-align: center;
      font-size: 14px;
    }
    .success {
      background: #238636;
      color: white;
      padding: 10px;
      border-radius: 6px;
      margin: 10px 0;
      text-align: center;
      font-size: 14px;
    }
    .hidden { display: none; }
    .loader { text-align: center; }
    .spinner { 
      border: 3px solid #30363d; 
      border-top: 3px solid #58a6ff; 
      border-radius: 50%; 
      width: 40px; 
      height: 40px; 
      animation: spin 1s linear infinite; 
      margin: 0 auto 20px; 
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="container">
    <h1>CreativePay</h1>

    <!-- LOADING STATE -->
    <div id="loader" class="loader">
      <div class="spinner"></div>
      <p>Loading CreativePay...</p>
    </div>

    <!-- LOGIN FORM -->
    <div id="loginForm" class="hidden">
      <h2>Login</h2>
      <div id="loginError" class="error hidden"></div>
      <input type="email" id="loginEmail" placeholder="Email" />
      <input type="password" id="loginPassword" placeholder="Password" />
      <button onclick="handleLogin()">Login</button>
      <div class="link" onclick="showRegister()">Don't have an account? Register</div>
    </div>

    <!-- REGISTER FORM -->
    <div id="registerForm" class="hidden">
      <h2>Register</h2>
      <div id="registerError" class="error hidden"></div>
      <input type="text" id="registerName" placeholder="Full Name" />
      <input type="email" id="registerEmail" placeholder="Email" />
      <input type="password" id="registerPassword" placeholder="Password (min 6 chars)" />
      <button onclick="handleRegister()">Register</button>
      <div class="link" onclick="showLogin()">Already have an account? Login</div>
    </div>

    <!-- BVN VERIFICATION -->
    <div id="bvnForm" class="hidden">
      <div class="kyc-warning">
        <strong>KYC TIER 1 REQUIRED</strong><br>
        Verify your BVN to unlock your CreativePay dashboard and enable transactions.
      </div>
      <h2>BVN Verification</h2>
      <div id="bvnError" class="error hidden"></div>
      <div id="bvnSuccess" class="success hidden"></div>
      <label>Bank Verification Number (BVN)</label>
      <input type="text" id="bvnInput" placeholder="Enter 11-digit BVN" maxlength="11" />
      <button onclick="handleBVN()">Verify BVN</button>
      <div class="link" onclick="handleLogout()">Logout</div>
    </div>
  </div>

  <script>
    // =========================
    // 1. GLOBAL STATE & HELPERS
    // =========================
    const API_URL = ''; // Same domain, no CORS needed

    function getToken() {
      return localStorage.getItem('token');
    }

    function setToken(token) {
      localStorage.setItem('token', token);
    }

    function clearToken() {
      localStorage.removeItem('token');
    }

    function showError(elementId, message) {
      const el = document.getElementById(elementId);
      el.textContent = message;
      el.classList.remove('hidden');
    }

    function hideError(elementId) {
      document.getElementById(elementId).classList.add('hidden');
    }

    function showSuccess(elementId, message) {
      const el = document.getElementById(elementId);
      el.textContent = message;
      el.classList.remove('hidden');
    }

    function hideAll() {
      document.getElementById('loader').classList.add('hidden');
      document.getElementById('loginForm').classList.add('hidden');
      document.getElementById('registerForm').classList.add('hidden');
      document.getElementById('bvnForm').classList.add('hidden');
    }

    // =========================
    // 2. PAGE NAVIGATION
    // =========================
    function showLogin() {
      hideAll();
      document.getElementById('loginForm').classList.remove('hidden');
    }

    function showRegister() {
      hideAll();
      document.getElementById('registerForm').classList.remove('hidden');
    }

    function showBVN() {
      hideAll();
      document.getElementById('bvnForm').classList.remove('hidden');
    }

    // =========================
    // 3. AUTH FUNCTIONS
    // =========================
    async function handleRegister() {
      hideError('registerError');
      const fullName = document.getElementById('registerName').value;
      const email = document.getElementById('registerEmail').value;
      const password = document.getElementById('registerPassword').value;

      if (!email || !password) {
        showError('registerError', 'Email and password required');
        return;
      }

      try {
        const res = await fetch(`${API_URL}/api/auth/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ fullName, email, password })
        });

        const data = await res.json();

        if (!res.ok) {
          showError('registerError', data.error || 'Registration failed');
          return;
        }

        setToken(data.token);
        showBVN();

      } catch (err) {
        showError('registerError', 'Network error. Try again.');
      }
    }

    async function handleLogin() {
      hideError('loginError');
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;

      if (!email || !password) {
        showError('loginError', 'Email and password required');
        return;
      }

      try {
        const res = await fetch(`${API_URL}/api/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (!res.ok) {
          showError('loginError', data.error || 'Login failed');
          return;
        }

        setToken(data.token);

        // Check KYC status and route accordingly
        if (data.user.kycTier === 0) {
          showBVN();
        } else {
          // KYC verified - redirect to server wallet UI
          window.location.href = '/?token=' + data.token;
        }

      } catch (err) {
        showError('loginError', 'Network error. Try again.');
      }
    }

    function handleLogout() {
      clearToken();
      showLogin();
    }

    // =========================
    // 4. BVN VERIFICATION
    // =========================
    async function handleBVN() {
      hideError('bvnError');
      hideError('bvnSuccess');

      const bvn = document.getElementById('bvnInput').value;
      const token = getToken();

      if (!token) {
        showError('bvnError', 'Session expired. Please login again.');
        showLogin();
        return;
      }

      if (!bvn || bvn.length !== 11) {
        showError('bvnError', 'BVN must be 11 digits');
        return;
      }

      try {
        const res = await fetch(`${API_URL}/api/kyc/bvn`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ bvn })
        });

        const data = await res.json();

        if (!res.ok) {
          showError('bvnError', data.error || 'BVN verification failed');
          return;
        }

        showSuccess('bvnSuccess', 'BVN verified successfully!');
        // Redirect to server wallet UI after BVN success
        setTimeout(() => {
          window.location.href = '/?token=' + token;
        }, 1500);

      } catch (err) {
        showError('bvnError', 'Network error. Try again.');
      }
    }

    // =========================
    // 5. AUTO-LOGIN ON PAGE LOAD - KEY FIX FOR PHASE 2
    // =========================
    async function checkAuth() {
      const token = getToken();
      
      if (!token) {
        hideAll();
        showLogin();
        return;
      }

      try {
        const res = await fetch(`${API_URL}/api/auth/me`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });

        if (!res.ok) {
          clearToken();
          hideAll();
          showLogin();
          return;
        }

        const data = await res.json();

        if (data.user.kycTier === 0) {
          hideAll();
          showBVN();
        } else {
          // User is logged in + KYC verified = redirect to server wallet UI
          window.location.href = '/?token=' + token;
        }

      } catch (err) {
        clearToken();
        hideAll();
        showLogin();
      }
    }

    // Run on page load
    checkAuth();
  </script>
</body>
</html>

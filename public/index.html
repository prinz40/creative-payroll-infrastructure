<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CreativePay - Payment Gateway</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0f172a; color: #e2e8f0; font-family: system-ui, -apple-system, sans-serif; min-height: 100vh; }
    .container { background: #1e293b; padding: 30px; border-radius: 12px; width: 100%; max-width: 400px; border: 1px solid #334155; margin: 20px auto; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    h1 { color: #38bdf8; text-align: center; margin-bottom: 20px; font-size: 24px; }
    h2 { text-align: center; margin-bottom: 20px; }
    input, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 6px; border: 1px solid #334155; }
    input { background: #0f172a; color: #e2e8f0; }
    button { background: #2563eb; color: white; border: none; cursor: pointer; font-weight: 600; }
    button:hover { background: #1d4ed8; }
    button:disabled { background: #475569; cursor: not-allowed; }
    .error { background: #dc2626; color: white; padding: 10px; border-radius: 6px; margin: 10px 0; text-align: center; display: none; }
    .success { background: #16a34a; color: white; padding: 10px; border-radius: 6px; margin: 10px 0; text-align: center; display: none; }
    .link { text-align: center; margin-top: 15px; color: #38bdf8; cursor: pointer; font-size: 14px; }
    .hidden { display: none !important; }
    .dashboard { max-width: 800px; margin: 0 auto; padding: 20px; }
    .card { background: #1e293b; padding: 24px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #334155; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
    .balance-card { text-align: center; }
    .balance-amount { font-size: 36px; font-weight: 700; color: #4ade80; }
    .kyc-banner { background: #166534; color: #4ade80; padding: 12px; border-radius: 8px; text-align: center; margin-bottom: 20px; }
    .kyc-warning { background: #854d0e; color: #facc15; padding: 12px; border-radius: 6px; margin-bottom: 20px; text-align: center; }
  </style>
</head>
<body>
  <!-- AUTH FORM -->
  <div id="authForm" class="container">
    <h1>CreativePay</h1>

    
    <!-- LOGIN -->
    <div id="loginSection">
      <h2>Login</h2>
      <div id="loginError" class="error"></div>
      <input type="email" id="loginEmail" placeholder="Email" />
      <input type="password" id="loginPassword" placeholder="Password" />
      <button onclick="handleLogin()">Login</button>
      <div class="link" onclick="switchToRegister()">Don't have account? Register</div>
    </div>

    <!-- REGISTER -->
    <div id="registerSection" class="hidden">
      <h2>Register</h2>
      <div id="registerError" class="error"></div>
      <input type="text" id="registerName" placeholder="Full Name" />
      <input type="email" id="registerEmail" placeholder="Email" />
      <input type="password" id="registerPassword" placeholder="Password" />
      <button onclick="handleRegister()">Register</button>
      <div class="link" onclick="switchToLogin()">Have account? Login</div>
    </div>

    <!-- BVN -->
    <div id="bvnSection" class="hidden">
      <div class="kyc-warning">
        <strong>KYC REQUIRED</strong><br>
        Verify your BVN to proceed
      </div>
      <h2>BVN Verification</h2>
      <div id="bvnError" class="error"></div>
      <div id="bvnSuccess" class="success"></div>
      <input type="text" id="bvnInput" placeholder="Enter 11-digit BVN" maxlength="11" pattern="[0-9]*" />
      <button onclick="handleBVN()">Verify BVN</button>
      <div class="link" onclick="handleLogout()">Logout</div>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboardSection" class="dashboard hidden">
    <div class="header">
      <h1>Dashboard</h1>
      <button onclick="handleLogout()" style="width: auto; background: #dc2626;">Logout</button>
    </div>

    <div class="kyc-banner" id="kycBanner" style="display: none;">
      ✅ KYC VERIFIED - Welcome!
    </div>

    <div class="card">
      <div>Email: <strong id="userEmail"></strong></div>
      <div>Name: <strong id="userName"></strong></div>
      <div>Status: <strong id="userStatus"></strong></div>
    </div>

    <div class="card balance-card">
      <div style="color: #94a3b8; margin-bottom: 8px;">Balance</div>
      <div class="balance-amount" id="userBalance">₦0.00</div>
      <div style="font-size: 12px; margin-top: 12px; color: #64748b;" id="walletId"></div>
    </div>
  </div>

  <script>
    const API_URL = window.location.origin; // Auto-detect current domain
    const TOKEN_KEY = 'creativepay_token';

    // HELPERS
    const getToken = () => localStorage.getItem(TOKEN_KEY);
    const setToken = (t) => localStorage.setItem(TOKEN_KEY, t);
    const clearToken = () => localStorage.removeItem(TOKEN_KEY);

    const showError = (id, msg) => {
      const el = document.getElementById(id);
      el.textContent = msg;
      el.style.display = 'block';
      setTimeout(() => el.style.display = 'none', 5000);
    };

    const showSuccess = (id, msg) => {
      const el = document.getElementById(id);
      el.textContent = msg;
      el.style.display = 'block';
    };

    // API CALLS
    async function apiCall(endpoint, options = {}) {
      const token = getToken();
      try {
        const res = await fetch(`${API_URL}${endpoint}`, {
          ...options,
          headers: {
            'Content-Type': 'application/json',
            ...(token && { 'Authorization': `Bearer ${token}` }),
            ...options.headers
          }
        });

        if (res.status === 401) {
          clearToken();
          location.reload();
        }

        const data = await res.json();
        if (!res.ok) throw new Error(data.message || 'Request failed');
        return data;
      } catch (err) {
        throw err;
      }
    }

    // AUTH FLOWS
    async function handleLogin() {
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      if (!email || !password) {
        showError('loginError', 'Email and password required');
        return;
      }

      try {
        const data = await apiCall('/api/login', {
          method: 'POST',
          body: JSON.stringify({ email, password })
        });
        setToken(data.token);
        showDashboard(data.user);
      } catch (err) {
        showError('loginError', err.message);
      }
    }

    async function handleRegister() {
      const fullName = document.getElementById('registerName').value.trim();
      const email = document.getElementById('registerEmail').value.trim();
      const password = document.getElementById('registerPassword').value;
      if (!fullName || !email || !password) {
        showError('registerError', 'All fields required');
        return;
      }

      try {
        const data = await apiCall('/api/register', {
          method: 'POST',
          body: JSON.stringify({ fullName, email, password })
        });
        setToken(data.token);
        showBVN();
      } catch (err) {
        showError('registerError', err.message);
      }
    }

    async function handleBVN() {
      const bvn = document.getElementById('bvnInput').value.trim();
      if (bvn.length !== 11 || !/^\d+$/.test(bvn)) {
        showError('bvnError', 'BVN must be 11 digits');
        return;
      }

      try {
        const data = await apiCall('/api/bvn', {
          method: 'POST',
          body: JSON.stringify({ bvn })
        });
        showSuccess('bvnSuccess', '✅ BVN verified! Loading dashboard...');
        setTimeout(() => showDashboard(data.user), 1500);
      } catch (err) {
        showError('bvnError', err.message);
      }
    }

    // UI FUNCTIONS
    function switchToRegister() {
      document.getElementById('loginSection').classList.add('hidden');
      document.getElementById('registerSection').classList.remove('hidden');
      document.getElementById('bvnSection').classList.add('hidden');
    }

    function switchToLogin() {
      document.getElementById('loginSection').classList.remove('hidden');
      document.getElementById('registerSection').classList.add('hidden');
      document.getElementById('bvnSection').classList.add('hidden');
    }

    function showBVN() {
      document.getElementById('authForm').classList.remove('hidden');
      document.getElementById('dashboardSection').classList.add('hidden');
      document.getElementById('loginSection').classList.add('hidden');
      document.getElementById('registerSection').classList.add('hidden');
      document.getElementById('bvnSection').classList.remove('hidden');
    }

    function showDashboard(user) {
      document.getElementById('authForm').classList.add('hidden');
      document.getElementById('dashboardSection').classList.remove('hidden');
      
      document.getElementById('userEmail').textContent = user.email;
      document.getElementById('userName').textContent = user.fullName;
      document.getElementById('userStatus').textContent = user.kycTier >= 1 ? '✅ KYC Verified' : '⚠️ Pending';
      
      const balances = user.balances || { NGN: 0, GHS: 0, KES: 0 };
      document.getElementById('userBalance').textContent = `₦${Number(balances.NGN || 0).toFixed(2)}`;
      document.getElementById('walletId').textContent = `Wallet: ${user.walletId || 'N/A'}`;
      
      if (user.kycTier >= 1) {
        document.getElementById('kycBanner').style.display = 'block';
      }
    }

    function handleLogout() {
      clearToken();
      location.reload();
    }

    // INIT
    window.addEventListener('DOMContentLoaded', async () => {
      if (getToken()) {
        try {
          const data = await apiCall('/api/user');
          showDashboard(data.user);
        } catch {
          clearToken();
          switchToLogin();
          document.getElementById('authForm').classList.remove('hidden');
        }
      } else {
        switchToLogin();
        document.getElementById('authForm').classList.remove('hidden');
      }
    });
  </script>
</body>
</html>

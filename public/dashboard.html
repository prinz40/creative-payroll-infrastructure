<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CreativePay Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      padding: 20px;
    }
   .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }
   .title {
      color: #38bdf8;
      font-size: 24px;
      font-weight: 700;
    }
   .logout {
      background: #ef4444;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }
   .card {
      background: #1e293b;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
    }
   .label {
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 4px;
    }
   .value {
      font-size: 20px;
      font-weight: 600;
    }
   .balance {
      font-size: 32px;
      color: #10b981;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">CreativePay Dashboard</div>
    <button class="logout" onclick="logout()">Logout</button>
  </div>

  <div class="card">
    <div class="label">Welcome back,</div>
    <div class="value" id="userName">Loading...</div>
  </div>

  <div class="card">
    <div class="label">Account Balance</div>
    <div class="balance" id="userBalance">₦0.00</div>
  </div>

  <div class="card">
    <div class="label">Email</div>
    <div class="value" id="userEmail">Loading...</div>
  </div>

  <script>
    // Decode JWT to get user info
    function parseJwt(token) {
      try {
        const base64Url = token.split('.')[1];
        const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
        const jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
          return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
        }).join(''));
        return JSON.parse(jsonPayload);
      } catch (e) {
        return null;
      }
    }

    // Check if user is logged in
    const token = localStorage.getItem('token');
    if (!token) {
      window.location.href = '/';
    } else {
      const userData = parseJwt(token);
      if (userData) {
        document.getElementById('userName').textContent = userData.name || 'User';
        document.getElementById('userEmail').textContent = userData.email || 'No email';
      } else {
        logout();
      }
    }

    function logout() {
      localStorage.removeItem('token');
      window.location.href = '/';
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CreativePay - Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f172a; color: #e2e8f0; padding: 20px;
    }
    .container { max-width: 800px; margin: 0 auto; }
    .header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid #334155;
    }
    h1 { color: #38bdf8; font-size: 24px; }
    .card {
      background: #1e293b; padding: 24px; border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3); margin-bottom: 20px;
    }
    .balance-card { text-align: center; }
    .balance-label { font-size: 14px; color: #94a3b8; margin-bottom: 8px; }
    .balance-amount { font-size: 36px; font-weight: 700; color: #4ade80; }
    .wallet-id { font-size: 12px; color: #64748b; margin-top: 8px; font-family: monospace; }
    .kyc-badge {
      display: inline-block; padding: 6px 12px; border-radius: 20px;
      font-size: 12px; font-weight: 600; margin-top: 12px;
      background: #334155; color: #94a3b8;
    }
    .kyc-verified { background: #166534; color: #4ade80; }
    .kyc-pending { background: #854d0e; color: #facc15; }
    .user-info { display: flex; justify-content: space-between; margin-bottom: 12px; }
    .label { color: #94a3b8; font-size: 14px; }
    .value { font-weight: 600; }
    .logout-btn {
      background: #dc2626; color: white; border: none;
      padding: 8px 16px; border-radius: 6px; cursor: pointer;
    }
    .logout-btn:hover { background: #b91c1c; }
    #output-window {
      background: #0f172a; padding: 16px; border-radius: 8px;
      font-family: monospace; font-size: 12px; overflow-x: auto;
      margin-top: 20px; border: 1px solid #334155;
    }
    .loading { text-align: center; padding: 40px; color: #94a3b8; }
    .kyc-banner {
      background: #166534; color: #4ade80; padding: 12px;
      border-radius: 8px; text-align: center; font-weight: 600;
      margin-bottom: 20px; display: none;
    }
    .fund-btn {
      padding: 12px; background: #2563eb; border: none; border-radius: 6px; 
      color: white; cursor: pointer; width: 100%; font-weight: 600;
    }
    .fund-btn:hover { background: #1d4ed8; }
    .fund-btn:disabled { background: #475569; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>CreativePay Dashboard</h1>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>

    <div id="loadingState" class="loading">Loading your account...</div>

    <div id="dashboardContent" style="display: none;">
      <div class="kyc-banner" id="kyc-banner">
        ✅ KYC TIER 1 VERIFIED - Welcome to CreativePay!
      </div>

      <div class="card">
        <div class="user-info">
          <span class="label">Account Email</span>
          <span class="value" id="user-email">Loading...</span>
        </div>
        <div class="user-info">
          <span class="label">Full Name</span>
          <span class="value" id="user-name">Loading...</span>
        </div>
        <div class="user-info">
          <span class="label">KYC Status</span>
          <span class="kyc-badge" id="kyc-badge">Checking...</span>
        </div>
      </div>

      <div class="card balance-card">
        <div class="balance-label">Available Balance</div>
        <div class="balance-amount" id="user-balance">Loading...</div>
        <div class="wallet-id" id="wallet-id">Wallet ID: Loading...</div>
      </div>

      <div class="card">
        <h3 style="margin-bottom: 16px;">Quick Actions</h3>
        <div style="display: grid; gap: 12px;">
          <button onclick="fundWallet()" id="fundWalletBtn" class="fund-btn">
            + Fund Wallet
          </button>
          <button onclick="alert('Send Money coming in Phase 3')" 
                  style="padding: 12px; background: #16a34a; border: none; border-radius: 6px; color: white; cursor: pointer;">
            Send Money
          </button>
        </div>
      </div>

      <div class="card">
        <h3 style="margin-bottom: 16px;">Live Metrics</h3>
        <pre id="output-window">Connecting to CreativePay servers...</pre>
      </div>
    </div>
  </div>

  <script src="https://js.paystack.co/v1/inline.js"></script>

  <script>
    const API_URL = ''; // Same domain
    const TOKEN_KEY = 'creativepay_token';

    // =========================
    // 1. AUTH + FETCH FRESH DATA ON EVERY LOAD
    // =========================
    document.addEventListener('DOMContentLoaded', async () => {
      await loadUserData();
    });

    async function loadUserData() {
      const token = localStorage.getItem(TOKEN_KEY);
      if (!token) return window.location.href = '/';

      try {
        const res = await fetch(`${API_URL}/api/user`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });

        if (res.status === 401) throw new Error('Session expired');
        if (!res.ok) throw new Error('Server error');

        const data = await res.json();

        // Fix: Handles flat responses and nested object parameters dynamically
        const userData = data.user ? data.user : data;

        window.currentUser = userData;
        localStorage.setItem('user', JSON.stringify(userData));
        updateDashboard(userData);

        document.getElementById('loadingState').style.display = 'none';
        document.getElementById('dashboardContent').style.display = 'block';

        document.getElementById('output-window').textContent = 
          `✅ Connected to CreativePay\nUser: ${userData.email}\nBalance: ₦${Number(userData.balance || 0).toFixed(2)}\nWallet: ${userData.walletId || 'Pending'}`;

      } catch (error) {
        console.error('Load Error:', error);
        document.getElementById('loadingState').textContent = 'Session expired. Please login again.';
        setTimeout(() => logout(), 2000);
      }
    }

    function logout() {
      localStorage.removeItem(TOKEN_KEY);
      localStorage.removeItem('user');
      window.location.href = '/';
    }

    // =========================
    // 2. UPDATE UI WITH FRESH DATA - BULLETPROOF
    // =========================
    function updateDashboard(userData) {
      document.getElementById('user-email').textContent = userData.email || 'N/A';
      document.getElementById('user-name').textContent = userData.fullName || 'CreativePay User';

      const kycBadge = document.getElementById('kyc-badge');
      if (userData.kycTier >= 1) {
        kycBadge.textContent = 'KYC TIER 1 VERIFIED';
        kycBadge.className = 'kyc-badge kyc-verified';
        document.getElementById('kyc-banner').style.display = 'block';
      } else {
        kycBadge.textContent = 'UNVERIFIED';
        kycBadge.className = 'kyc-badge';
        document.getElementById('kyc-banner').style.display = 'none';
      }

      // Balance tracking safely parsed out of raw strings
      const balance = Number(userData.balance || 0);
      document.getElementById('user-balance').textContent = `₦${balance.toFixed(2)}`;

      document.getElementById('wallet-id').textContent = userData.walletId 
        ? `Wallet ID: ${userData.walletId}` 
        : 'Wallet ID: Complete KYC to activate';
    }

    // =========================
    // 3. FUND WALLET - COMPLETE FLOW WITH AUTO-REFRESH
    // =========================
    function fundWallet() {
      // Fix: Account for variable structure fallbacks across id values
      const userId = window.currentUser?.id || window.currentUser?._id;

      if (!userId) {
        alert('Please wait, loading your account...');
        return;
      }
      if (window.currentUser.kycTier < 1) {
        alert('Please complete BVN verification before funding your wallet.');
        return;
      }

      let amount = prompt("Enter amount to fund ₦:", "1000");
      if (!amount || isNaN(amount) || Number(amount) < 100) {
        alert("Minimum funding amount is ₦100");
        return;
      }

      const fundBtn = document.getElementById('fundWalletBtn');
      fundBtn.disabled = true;
      fundBtn.innerText = 'Opening Paystack...';

      const userEmail = window.currentUser.email;

      let handler = PaystackPop.setup({
        key: 'pk_test_22b404c1f15be9c94cbde8be2b54d9aa3bce9b4e',
        email: userEmail,
        amount: Number(amount) * 100,
        currency: 'NGN',
        ref: 'CPY-FUND-' + Date.now() + '-' + userId.slice(-4),
        // FIX: Pass both formatting parameters so the transaction handler links correctly
        metadata: { 
          user_id: userId,
          userId: userId
        },
        onClose: function(){
          alert('Payment cancelled');
          fundBtn.disabled = false;
          fundBtn.innerText = '+ Fund Wallet';
        },
        callback: function(response){
          verifyPaymentOnServer(response.reference);
        }
      });
      handler.openIframe();
    }

    async function verifyPaymentOnServer(reference) {
      const fundBtn = document.getElementById('fundWalletBtn');
      fundBtn.innerText = 'Verifying Payment...';

      try {
        const res = await fetch(`${API_URL}/api/fund-wallet/verify`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + localStorage.getItem(TOKEN_KEY)
          },
          body: JSON.stringify({ reference })
        });

        const data = await res.json();

        if(data.success) {
          // Re-fetch account profile state variables instantly to synchronize UI elements
          await loadUserData();
          alert(`Success! ₦${data.amount} added. Your balance has been updated.`);
        } else {
          alert('Verification failed: ' + data.message);
        }

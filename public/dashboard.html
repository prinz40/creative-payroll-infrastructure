<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CreativePay Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f172a; color: #e2e8f0; padding: 20px;
    }
   .container { max-width: 800px; margin: 40px auto; }
    h1 { color: #38bdf8; margin-bottom: 10px; }
   .card { 
      background: #1e293b; padding: 30px; border-radius: 12px; 
      box-shadow: 0 4px 6px rgba(0,0,0,0.3); margin-bottom: 20px;
    }
   .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
    button { 
      padding: 10px 20px; background: #ef4444; color: white;
      border: none; border-radius: 8px; font-weight: 600; cursor: pointer;
    }
   .balance { font-size: 48px; font-weight: 700; color: #4ade80; margin: 20px 0; }
   .label { color: #94a3b8; font-size: 14px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>CreativePay Dashboard</h1>
      <button onclick="logout()">Logout</button>
    </div>
    
    <div class="card">
      <div class="label">Welcome back,</div>
      <h2 id="userName">Loading...</h2>
    </div>

    <div class="card">
      <div class="label">Account Balance</div>
      <div class="balance">₦0.00</div>
    </div>

    <div class="card">
      <div class="label">Email</div>
      <div id="userEmail">Loading...</div>
    </div>
  </div>

  <script>
    const token = localStorage.getItem('token');
    if (!token) {
      window.location.href = '/';
    }

    function parseJwt(token) {
      try {
        return JSON.parse(atob(token.split('.')[1]));
      } catch (e) {
        return null;
      }
    }

    const user = parseJwt(token);
    if (user) {
      document.getElementById('userName').textContent = user.name || 'User';
      document.getElementById('userEmail').textContent = user.email || 'N/A';
    }

    function logout() {
      localStorage.removeItem('token');
      window.location.href = '/';
    }
  </script>
</body>
</html>
